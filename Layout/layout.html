<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="height: 30vh; border: 2px solid black; padding: 0;">
        <div class="row" style="border: 2px solid black; margin: 2px;">
            <div class="col" style="border: 2px solid black; margin: 2px; padding: 5px;">
                Column 1
            </div>
            <div class="col" style="border: 2px solid black; margin: 2px; padding: 5px;">
                Column 2
            </div>
            <div class="col" style="border: 2px solid black; margin: 2px; padding: 5px;">
                Column 3
            </div>
        </div>
    </div>

    <div class="container bg-info" style="height: 30vh; margin-top: 20px; padding: 0;">
        <div class="row" style="margin: 2px;">
            <div class="col bg-primary text-light" style="padding: 5px; margin: 2px;">
                Column 1
            </div>
            <div class="col bg-primary text-light" style="padding: 5px; margin: 2px;">
                Column 2
            </div>
            <div class="col bg-primary text-light" style="padding: 5px; margin: 2px;">
                Column 3
            </div>
        </div>
    </div>
    <div class="container" style="height: 30vh; margin-top: 2rem; border: 2px solid black; overflow: scroll;">
        <div class="row" style="margin: 2px; border: 2px solid black;">
            <div class="col-lg" style="border: 2px solid black;  margin: 2px; padding: 5px;">
                Column 1
            </div>
            <div class="col-lg" style="border: 2px solid black;  margin: 2px; padding: 5px;">
                Column 2
            </div>
            <div class="col-lg" style="border: 2px solid black;  margin: 2px; padding: 5px;">
                Column 3
            </div>
        </div>
        <div class="row" style="margin: 2px; border: 2px solid black;">
            <div class="col-xl" style="border: 2px solid black; margin: 2px; padding: 5px;">
                Column 4
            </div>
            <div class="col-xl" style="border: 2px solid black; margin: 3px; padding: 5px;">
                Column 5
            </div>
            <div class="col-xl" style="border: 2px solid black; margin: 4px; padding: 5px;">
                Column 6
            </div>
        </div>
    </div>
    <div class="container bg-secondary mt-2" style="height: 30vh;">
        <div class="row bg-danger text-light m-2">
            <div class="col-md bg-primary m-2">
                Column 1
            </div>
            <div class="col-md bg-success m-2">
                Column 2
            </div>
            <div class="col-md bg-primary m-2">
                Column 3
            </div>
        </div>
        <div class="row bg-warning text-dark m-2">
            <div class="col-xl bg-info m-2">
                Column 4
            </div>
            <div class="col-xl bg-success m-2">
                Column 5
            </div>
            <div class="col-xl bg-info m-2">
                Column 6
            </div>
        </div>
    </div>
</body>
</html>
